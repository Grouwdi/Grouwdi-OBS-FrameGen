Description="Grouwdi-OBS-FrameGen: fills repeated capture-card frames with real motion (NVIDIA optical flow) and measures capture timing."
CaptureSmoother="Capture Smoother"
StatusWaiting="Collecting data... reopen this window after the first log interval."
LogSeconds="Report every"
RepairRepeats="Repair repeated frames (adds 2 frames of video delay)"
RepairRepeats.Tooltip="Replaces a single repeated frame with a 50/50 blend of the frames on either side. Leave this off when Motion Smoother is on: it fills repeats with real motion instead of a blend, and a blend shows as a double image."
MotionSmoother="Motion Smoother (NVIDIA)"
MotionSmoother.Starting="Starting... shows status once the source is visible."
MotionSmoother.Delay="Video delay (frames)"
MotionSmoother.Delay.Tooltip="How far behind live the video runs so the smoother can see ahead. 3 is recommended with 'Fill missing frames only'. More = smoother on uneven motion in the other modes. Add the same delay to your capture audio Sync Offset (about +17 ms per frame at 60 fps)."
MotionSmoother.Quality="Optical flow quality"
MotionSmoother.Quality.Fast="Fast"
MotionSmoother.Quality.Medium="Medium (recommended)"
MotionSmoother.Quality.Slow="Slow (best quality)"
MotionSmoother.FlowWidth="Optical flow resolution (width)"
MotionSmoother.RecordTrace="Record 60-second diagnostic trace"
MotionSmoother.Ghost="Smoothness vs. ghosting"
MotionSmoother.Ghost.Smooth="Smoothest (most generated frames)"
MotionSmoother.Ghost.Balanced="Balanced"
MotionSmoother.Ghost.Sharp="Least ghosting (fewer generated frames)"
MotionSmoother.Ghost.FillOnly="Fill missing frames only (recommended: no ghosting on real frames)"
MotionSmoother.Ghost.Tooltip="Generated in-between frames can show ghosting around fast-moving objects. Balanced and Least ghosting show a real frame whenever the in-between point is close to one. Fill missing frames only shows every real frame untouched and generates a frame only where the card repeated one; it works at delay 3."
MotionSmoother.Recalibrate="Recalibrate flow direction"
MotionSmoother.Recalibrate.Tooltip="The flow direction is calibrated once (pan the camera for a few seconds) and saved for every scene. Use this only if smoothing looks wrong after a GPU or driver change."
